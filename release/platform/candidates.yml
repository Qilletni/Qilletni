# Platform release candidates - mutable staging file.
#
# Unlike an immutable `release/platform/X.Y.Z.yml` manifest, this file is
# expected to change over time as QilletniToolchain/QPMCLI publish new
# releases. It is, however, mutable ONLY through a reviewed pull request:
#
#   - The "Platform Candidate Dispatch" workflow
#     (.github/workflows/platform-candidate-dispatch.yml) opens a PR here
#     automatically whenever Toolchain or QPM publishes, after re-verifying
#     the incoming release event's tag/asset/hash/embedded-version claims
#     live against the GitHub API.
#   - A maintainer may otherwise hand-edit it directly via a normal PR.
#
# Nothing ever pushes to this file outside a PR, and this file alone never
# triggers a Docker build: a maintainer separately runs the manual
# "Prepare Platform Release" workflow (platform-prepare.yml) to promote a
# reviewed snapshot of it into a new, immutable `release/platform/X.Y.Z.yml`.
#
# Seeded identically to the verified composition in `1.0.0.yml` (see that
# file's header for the exact verification sources); validated by
# `tools/release/src/platform_candidates.ts`.
