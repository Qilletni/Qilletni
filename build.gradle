plugins {
    id 'antlr'
    id 'idea'
    id 'maven-publish'
    id 'com.vanniktech.maven.publish' version '0.35.0'
    id 'me.champeau.gradle.japicmp' version '0.4.6'
    id 'org.cyclonedx.bom' version '3.2.4'
}

group = 'dev.qilletni.impl'
version = qilletniVersion

// Locks the resolved dependency graph (gradle.lockfile) for reproducibility
// Regenerate with `./gradlew dependencies --write-locks` after
// a dependency change.
dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // SLF4J API dependency
    implementation 'org.apache.logging.log4j:log4j-api:2.25.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.25.3'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.25.1'

    implementation 'org.antlr:antlr4-runtime:4.13.1'
    antlr 'org.antlr:antlr4:4.13.1'

    implementation 'com.google.code.gson:gson:2.10.1'

    implementation project(':qilletni-api')
}

mavenPublishing {
    coordinates(group, "qilletni", version)

    pom {
        name = "Qilletni"
        description = "Implementation of the Qilletni DSL"
        inceptionYear = "2024"
        url = "https://qilletni.dev/"
        licenses {
            license {
                name = "MIT"
                url = "https://mit-license.org/"
                distribution = "https://mit-license.org/"
            }
        }
        developers {
            developer {
                id = "RubbaBoy"
                name = "Adam Yarris"
                url = "https://github.com/RubbaBoy/"
            }
        }
        scm {
            url = "https://github.com/Qilletni/Qilletni"
            connection = "scm:git:git://github.com/Qilletni/Qilletni.git"
            developerConnection = "scm:git:ssh://git@github.com/Qilletni/Qilletni.git"
        }
    }
}

generateGrammarSource {
    var pkg = 'dev.qilletni.impl.antlr'
    outputDirectory = new File("${project.buildDir}/generated-src/antlr/main/${pkg.split("\\.").join("/")}".toString())
    maxHeapSize = "128m"
    arguments += ['-visitor', '-no-listener']
}

compileJava.dependsOn generateGrammarSource

sourceSets {
    generated {
        java.srcDir 'generated-src/antlr/main/'
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'com.vanniktech.maven.publish'

    repositories {
        mavenLocal()
        mavenCentral()

        maven {
            url = 'https://central.sonatype.com/repository/maven-snapshots/'
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = '22'
        targetCompatibility = '22'
    }
}

tasks.named('sourcesJar').configure {
    dependsOn 'generateGrammarSource'
}

test {
    useJUnitPlatform()

    // Tests are severely outdated; See Qilletni#29
    enabled = false
}

// CycloneDX JSON SBOM, attached as a release asset by the publish workflow.
// Output: build/reports/cyclonedx-direct/bom.json
cyclonedxDirectBom {
    includeConfigs = ['runtimeClasspath']
}

// Public API compatibility check for `dev.qilletni.impl:qilletni`, enforced against
// the policy in `tools/release/src/japicmp_policy.ts` (see `.qilletni/release.yml`).
// `-PjapicmpBaselineJar=/path/to/old-qilletni.jar` points at the previously published
// baseline jar (downloaded and hash-verified beforehand by `release.artifact_verify`,
// see `tools/release/README.md`); the task is skipped if it is not supplied (e.g. for
// the first release). A local file path is used (rather than a Maven coordinate) to
// avoid Gradle resolving the dependency back to this very project.
import me.champeau.gradle.japicmp.JapicmpTask

def japicmpBaselineJar = findProperty('japicmpBaselineJar')

tasks.register('japicmpCheck', JapicmpTask) {
    description = 'Compares the current public API against the published baseline jar'
    onlyIf { japicmpBaselineJar != null }
    
    if (japicmpBaselineJar != null) {
        oldClasspath.from(files(japicmpBaselineJar))
    }
    
    newClasspath.from(tasks.named('jar').map { it.outputs.files })
    dependsOn tasks.named('jar')
    accessModifier = 'public'
    onlyBinaryIncompatibleModified = false
    failOnModification = false
    ignoreMissingClasses = true
    xmlOutputFile = file("${buildDir}/reports/japicmp/qilletni-core.xml")
}

// Guards a stable release publication from ever resolving a SNAPSHOT or
// dynamic-version dependency, run by release.yml before publishing a tag.
// Only considers actual external module dependencies (not project(':...')
// dependencies).
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

tasks.register('checkNoSnapshotDependencies') {
    description = 'Fails if the resolved runtime/compile classpath contains a SNAPSHOT or dynamic external dependency version'
    doLast {
        def offenders = []
        ['runtimeClasspath', 'compileClasspath'].each { configName ->
            configurations.getByName(configName).incoming.resolutionResult.allComponents.each { component ->
                def id = component.id
                if (id instanceof ModuleComponentIdentifier) {
                    def version = id.version
                    if (version.contains('SNAPSHOT') || version.contains('+') || version.startsWith('latest.')) {
                        offenders << "${configName}: ${id.group}:${id.module}:${version}".toString()
                    }
                }
            }
        }
        if (offenders) {
            throw new GradleException("A stable release must not resolve SNAPSHOT/dynamic dependencies:\n" + offenders.join('\n'))
        }
    }
}
