name: Release - Prepare

# Manually-triggered entry point for preparing a Qilletni core+API release.
# Delegates all the actual version/changelog computations to the central
# reusable workflow. Merging the resulting PR does not publish anything
# directly; the post-merge automation in release.yml automatically tags and
# publishes it once merged.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'SemVer bump kind'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    if: github.repository == 'Qilletni/Qilletni'
    uses: ./.github/workflows/reusable-release-prepare.yml
    with:
      component: qilletni-core
      bump: ${{ inputs.bump }}
    secrets:
      app-id: ${{ secrets.QILLETNI_RELEASE_APP_ID }}
      app-private-key: ${{ secrets.QILLETNI_RELEASE_APP_PRIVATE_KEY }}
